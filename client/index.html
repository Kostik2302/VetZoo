<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetZoo Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🐾 VetZoo Control System</span>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Кнопки действий -->
        <div class="row mb-4">
            <div class="col">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addAnimalModal">
                    ➕ Добавить животное
                </button>
                <button class="btn btn-success" onclick="loadAnimals()">
                    🔄 Обновить список
                </button>
            </div>
        </div>

        <!-- Карточки животных -->
        <div class="row" id="animalsList">
            <!-- Сюда будут загружаться животные -->
        </div>
    </div>

    <!-- Модальное окно добавления животного -->
    <div class="modal fade" id="addAnimalModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Добавить новое животное</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addAnimalForm">
                        <div class="mb-3">
                            <label class="form-label">Кличка</label>
                            <input type="text" class="form-control" id="animalName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Вид</label>
                            <input type="text" class="form-control" id="animalSpecies" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Дата прибытия</label>
                            <input type="date" class="form-control" id="arrivalDate">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Вольер</label>
                            <input type="text" class="form-control" id="enclosure">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Пол</label>
                            <select class="form-control" id="gender">
                                <option value="">Не указан</option>
                                <option value="М">Мужской</option>
                                <option value="Ж">Женский</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Примечания</label>
                            <textarea class="form-control" id="notes" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" onclick="addAnimal()">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно просмотра животного -->
    <div class="modal fade" id="viewAnimalModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="viewAnimalTitle">Информация о животном</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <ul class="nav nav-tabs" id="animalTabs">
                        <li class="nav-item">
                            <a class="nav-link active" data-bs-toggle="tab" href="#info">Информация</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" data-bs-toggle="tab" href="#exams">Осмотры</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" data-bs-toggle="tab" href="#vaccines">Прививки</a>
                        </li>
                    </ul>
                    
                    <div class="tab-content mt-3">
                        <div class="tab-pane fade show active" id="info">
                            <div id="animalInfo"></div>
                            <hr>
                            <!-- В модальном окне просмотра животного, секция с обновлением статуса -->
                            <h6>Обновить статус здоровья:</h6>
                            <select class="form-control mb-2" id="healthStatus">
                                <option value="здоров">Здоров</option>
                                <option value="болен">Болен</option>
                                <option value="на лечении">На лечении</option>
                                <option value="карантин">Карантин</option>
                                <option value="снят с учета">Снят с учета</option>
                            </select>
                            <button class="btn btn-sm btn-primary" onclick="updateStatus()">Обновить статус</button>
                        </div>
                        <div class="tab-pane fade" id="exams">
                            <button class="btn btn-sm btn-success mb-3" onclick="showAddExamForm()">➕ Добавить осмотр</button>
                            <div id="examsList"></div>
                        </div>
                        <div class="tab-pane fade" id="vaccines">
                            <button class="btn btn-sm btn-success mb-3" onclick="showAddVaccineForm()">➕ Добавить прививку</button>
                            <div id="vaccinesList"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно добавления осмотра -->
    <div class="modal fade" id="addExamModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Добавить осмотр</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addExamForm">
                        <input type="hidden" id="examAnimalId">
                        <div class="mb-3">
                            <label class="form-label">Ветеринар</label>
                            <input type="text" class="form-control" id="veterinarian" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Диагноз</label>
                            <input type="text" class="form-control" id="diagnosis" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Лечение</label>
                            <textarea class="form-control" id="treatment" rows="2" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Дата</label>
                            <input type="datetime-local" class="form-control" id="examDate">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" onclick="addExamination()">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно добавления прививки -->
    <div class="modal fade" id="addVaccineModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Добавить прививку</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addVaccineForm">
                        <input type="hidden" id="vaccineAnimalId">
                        <div class="mb-3">
                            <label class="form-label">Название вакцины</label>
                            <input type="text" class="form-control" id="vaccineName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ветеринар</label>
                            <input type="text" class="form-control" id="vaccineVeterinarian" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Дата прививки</label>
                            <input type="date" class="form-control" id="vaccineDate">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Следующая прививка</label>
                            <input type="date" class="form-control" id="nextVaccineDate">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" onclick="addVaccination()">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
