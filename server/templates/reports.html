<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналитические отчеты - VetZoo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">📊 Аналитические отчеты</span>
            <div>
                <a href="/" class="btn btn-sm btn-light me-2">На главную</a>
                <a href="/logout" class="btn btn-sm btn-outline-light">Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Вкладки отчетов -->
        <ul class="nav nav-tabs mb-4" id="reportTabs">
            <li class="nav-item">
                <a class="nav-link active" data-bs-toggle="tab" href="#healthReport">Здоровье животных</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#vaccinationReport">Вакцинация</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#examinationReport">Осмотры</a>
            </li>
        </ul>

        <!-- Содержимое вкладок -->
        <div class="tab-content">
            <!-- Отчет по здоровью -->
            <div class="tab-pane fade show active" id="healthReport">
                <div class="row">
                    <div class="col-md-6">
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5>Статусы здоровья животных</h5>
                            </div>
                            <div class="card-body">
                                <canvas id="healthChart" style="height: 300px;"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5>Статистика по видам</h5>
                            </div>
                            <div class="card-body">
                                <div id="speciesStats" class="stats-table"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Отчет по вакцинации -->
            <div class="tab-pane fade" id="vaccinationReport">
                <div class="row">
                    <div class="col-md-6">
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5>Общая статистика вакцинации</h5>
                            </div>
                            <div class="card-body">
                                <div id="vaccinationStats" class="mb-3"></div>
                                <canvas id="vaccinationChart" style="height: 300px;"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5>Животные без прививок</h5>
                            </div>
                            <div class="card-body">
                                <div id="animalsWithoutVaccines"></div>
                            </div>
                        </div>
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5>Динамика вакцинации</h5>
                            </div>
                            <div class="card-body">
                                <canvas id="vaccinationTimelineChart" style="height: 200px;"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Отчет по осмотрам -->
            <div class="tab-pane fade" id="examinationReport">
                <div class="row">
                    <div class="col-md-6">
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5>Статистика осмотров</h5>
                            </div>
                            <div class="card-body">
                                <div id="examinationStats" class="mb-3"></div>
                                <canvas id="examinationChart" style="height: 300px;"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5>Частые диагнозы</h5>
                            </div>
                            <div class="card-body">
                                <div id="commonDiagnoses" class="stats-table"></div>
                            </div>
                        </div>
                        <div class="card mb-4">
                            <div class="card-header">
                                <h5>Активность ветеринаров</h5>
                            </div>
                            <div class="card-body">
                                <div id="vetActivity"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Кнопки экспорта -->
        <div class="row mt-4">
            <div class="col">
                <div class="card">
                    <div class="card-header">
                        <h5>Экспорт отчетов</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-success me-2" onclick="exportReport('health', 'json')">📥 Экспорт здоровья (JSON)</button>
                        <button class="btn btn-success me-2" onclick="exportReport('vaccinations', 'json')">📥 Экспорт вакцинации (JSON)</button>
                        <button class="btn btn-success me-2" onclick="exportReport('examinations', 'json')">📥 Экспорт осмотров (JSON)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:5000/api';
        let healthChart, vaccinationChart, examinationChart, vaccinationTimelineChart;

        // Проверка авторизации
        fetch(`${API_URL}/me`, { credentials: 'include' })
            .then(res => {
                if (!res.ok) window.location.href = '/login';
                return res.json();
            })
            .then(user => {
                if (user.role !== 'admin' && user.role !== 'vet') {
                    window.location.href = '/';
                } else {
                    loadAllReports();
                }
            })
            .catch(() => window.location.href = '/login');

        // Загрузка всех отчетов
        async function loadAllReports() {
            await loadHealthReport();
            await loadVaccinationReport();
            await loadExaminationReport();
        }

        // Отчет по здоровью
        async function loadHealthReport() {
            const response = await fetch(`${API_URL}/reports/health-status`, {
                credentials: 'include'
            });
            const data = await response.json();
            
            // График статусов здоровья
            const ctx = document.getElementById('healthChart').getContext('2d');
            if (healthChart) healthChart.destroy();
            
            healthChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: Object.keys(data.status_counts),
                    datasets: [{
                        data: Object.values(data.status_counts),
                        backgroundColor: [
                            '#28a745', '#dc3545', '#ffc107', '#17a2b8', '#6c757d'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });

            // Статистика по видам
            const speciesDiv = document.getElementById('speciesStats');
            let html = '<table class="table table-sm">';
            html += '<tr><th>Вид</th><th>Всего</th><th>Статусы</th></tr>';
            
            for (const [species, stats] of Object.entries(data.species_stats)) {
                html += `<tr>
                    <td>${species}</td>
                    <td>${stats.total}</td>
                    <td>${Object.entries(stats.statuses).map(([s, c]) => `${s}: ${c}`).join(', ')}</td>
                </tr>`;
            }
            html += '</table>';
            speciesDiv.innerHTML = html;
        }

        // Отчет по вакцинации
        async function loadVaccinationReport() {
            const response = await fetch(`${API_URL}/reports/vaccinations`, {
                credentials: 'include'
            });
            const data = await response.json();

            // Общая статистика
            const statsDiv = document.getElementById('vaccinationStats');
            statsDiv.innerHTML = `
                <div class="alert alert-info">
                    <strong>Всего прививок:</strong> ${data.total_vaccinations}<br>
                    <strong>Охват вакцинацией:</strong> ${data.vaccination_coverage}%<br>
                    <strong>Предстоящих вакцинаций (30 дней):</strong> ${data.upcoming_vaccinations}<br>
                    <strong>Просроченных вакцинаций:</strong> <span class="text-danger">${data.overdue_vaccinations}</span>
                </div>
            `;

            // График типов вакцин
            const ctx = document.getElementById('vaccinationChart').getContext('2d');
            if (vaccinationChart) vaccinationChart.destroy();
            
            vaccinationChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(data.vaccines_by_type),
                    datasets: [{
                        label: 'Количество использований',
                        data: Object.values(data.vaccines_by_type),
                        backgroundColor: '#17a2b8'
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });

            // График по месяцам
            const timelineCtx = document.getElementById('vaccinationTimelineChart').getContext('2d');
            if (vaccinationTimelineChart) vaccinationTimelineChart.destroy();
            
            const months = Object.keys(data.vaccinations_by_month).sort();
            vaccinationTimelineChart = new Chart(timelineCtx, {
                type: 'line',
                data: {
                    labels: months,
                    datasets: [{
                        label: 'Количество вакцинаций',
                        data: months.map(m => data.vaccinations_by_month[m]),
                        borderColor: '#28a745',
                        backgroundColor: 'rgba(40, 167, 69, 0.1)',
                        fill: true
                    }]
                },
                options: {
                    responsive: true
                }
            });

            // Животные без прививок
            const animalsDiv = document.getElementById('animalsWithoutVaccines');
            if (data.animals_without_vaccinations.length === 0) {
                animalsDiv.innerHTML = '<p class="text-success">✓ Все животные имеют прививки</p>';
            } else {
                let html = '<ul class="list-group">';
                data.animals_without_vaccinations.forEach(a => {
                    html += `<li class="list-group-item d-flex justify-content-between align-items-center">
                        ${a.name} (${a.species})
                        <button class="btn btn-sm btn-outline-primary" onclick="window.location.href='/'">Перейти</button>
                    </li>`;
                });
                html += '</ul>';
                animalsDiv.innerHTML = html;
            }
        }

        // Отчет по осмотрам
        async function loadExaminationReport() {
            const response = await fetch(`${API_URL}/reports/examinations`, {
                credentials: 'include'
            });
            const data = await response.json();

            // Общая статистика
            const statsDiv = document.getElementById('examinationStats');
            statsDiv.innerHTML = `
                <div class="alert alert-info">
                    <strong>Всего осмотров:</strong> ${data.total_examinations}<br>
                    <strong>Осмотров за последние 3 месяца:</strong> ${data.recent_examinations}<br>
                    <strong>Количество ветеринаров:</strong> ${Object.keys(data.examinations_by_vet).length}
                </div>
            `;

            // График осмотров по месяцам
            const ctx = document.getElementById('examinationChart').getContext('2d');
            if (examinationChart) examinationChart.destroy();
            
            const months = Object.keys(data.examinations_by_month).sort();
            examinationChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: months,
                    datasets: [{
                        label: 'Количество осмотров',
                        data: months.map(m => data.examinations_by_month[m]),
                        borderColor: '#007bff',
                        backgroundColor: 'rgba(0, 123, 255, 0.1)',
                        fill: true
                    }]
                },
                options: {
                    responsive: true
                }
            });

            // Частые диагнозы
            const diagnosesDiv = document.getElementById('commonDiagnoses');
            let html = '<table class="table table-sm">';
            html += '<tr><th>Диагноз</th><th>Частота</th></tr>';
            
            for (const [diagnosis, count] of Object.entries(data.common_diagnoses)) {
                html += `<tr><td>${diagnosis}</td><td>${count}</td></tr>`;
            }
            html += '</table>';
            diagnosesDiv.innerHTML = html;

            // Активность ветеринаров
            const vetDiv = document.getElementById('vetActivity');
            let vetHtml = '<table class="table table-sm">';
            vetHtml += '<tr><th>Ветеринар</th><th>Осмотров</th></tr>';
            
            const sortedVets = Object.entries(data.examinations_by_vet).sort((a, b) => b[1] - a[1]);
            for (const [vet, count] of sortedVets) {
                vetHtml += `<tr><td>${vet}</td><td>${count}</td></tr>`;
            }
            vetHtml += '</table>';
            vetDiv.innerHTML = vetHtml;
        }

        // Экспорт отчета
        async function exportReport(type, format) {
            try {
                const response = await fetch(`${API_URL}/reports/export`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ type, format })
                });

                if (format === 'json') {
                    const data = await response.json();
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${type}_report_${new Date().toISOString().split('T')[0]}.json`;
                    a.click();
                }
            } catch (error) {
                alert('Ошибка экспорта: ' + error);
            }
        }
    </script>
</body>
</html>
